<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/><link href="CSS/header.css" rel="stylesheet"/><link href="CSS/footer.css" rel="stylesheet"/>
<title data-i18n="branches_page_title">Sucursales | PetCare</title>
<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
<!-- Leaflet -->
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"/>
<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<!-- CSS -->
<link href="CSS/mapa.css" rel="stylesheet"/>
<link href="CSS/site-overrides.css" rel="stylesheet"/>
</head>
<body><div data-petcare-header=""></div>
<main class="branches">
<section class="map-section">
<div class="map-toolbar">
<div>
<h2>
<i class="fa-solid fa-map-location-dot"></i>
<span data-i18n="branches_map_title">
                        Mapa de sucursales
                    </span>
</h2>
<p data-i18n="branches_map_desc">
                    Explora nuestras tiendas en El Salvador.
                </p>
</div>
<div class="legend">
<span>
<span class="dot green"></span>
<span data-i18n="branch_open">
                        Abierta
                    </span>
</span>
<span>
<span class="dot red"></span>
<span data-i18n="branch_closed">
                        Cerrada
                    </span>
</span>
</div>
</div>
<div id="map"></div>
</section>
<button class="toggle-branches" id="toggleBranches">
<i class="fa-solid fa-store"></i>
<span data-i18n="branches_button">
            Sucursales
        </span>
<i class="fa-solid fa-chevron-down toggle-arrow">
</i>
</button>
<aside class="sidebar" id="branchPanel">
<div class="sidebar-header">
<div>
<h1 data-i18n="branches_title">
                    🏬 Nuestras Sucursales
                </h1>
<p data-i18n="branches_desc">
                    Encuentra la tienda más cercana.
                </p>
</div>
<button class="close-panel" id="closeBranches">
<i class="fa-solid fa-xmark"></i>
</button>
</div>
<div class="search-box">
<i class="fa-solid fa-magnifying-glass"></i>
<input data-i18n-placeholder="branch_search_placeholder" id="searchInput" placeholder="Buscar sucursal..." type="text"/>
</div>
<div class="filters">
<label data-i18n="department_label" for="departmentFilter">

                DEPARTAMENTO

            </label>
<select id="departmentFilter">
<option data-i18n="all_departments" value="Todas">
                    Todos los departamentos
                </option>
<option value="San Salvador">
                    San Salvador
                </option>
<option value="La Libertad">
                    La Libertad
                </option>
<option value="Santa Ana">
                    Santa Ana
                </option>
<option value="Sonsonate">
                    Sonsonate
                </option>
<option value="San Miguel">
                    San Miguel
                </option>
</select>
</div>
<div class="sidebar-actions">
<button id="btnLocate">
<i class="fa-solid fa-location-crosshairs"></i>
<span data-i18n="my_location">
                    Mi ubicación
                </span>
</button>
<button id="btnReset">
<i class="fa-solid fa-rotate-left"></i>
<span data-i18n="reset">
                    Restablecer
                </span>
</button>
</div>
<div class="branch-list" id="branchList">
</div>
</aside>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
<!-- Diccionario / cambio de idioma -->
<script src="JS/languague.js"></script>
<script src="JS/mapa.js"></script>
<div data-petcare-footer=""></div><script src="JS/shared.js"></script></body>
</html>
