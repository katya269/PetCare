<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<link href="CSS/header.css" rel="stylesheet"/><link href="CSS/footer.css" rel="stylesheet"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title data-i18n="favorites_page_title">Mis Favoritos | PetCare</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link href="CSS/favoritos.css" rel="stylesheet"/>
<link href="CSS/site-overrides.css" rel="stylesheet"/>
</head>
<body><div data-petcare-header=""></div>
<!-- =====================================================
     HEADER
===================================================== -->
<!-- =====================================================
     HERO
===================================================== -->
<section class="favorites-hero">
<div class="container">
<div class="hero-content">
<div>
<span class="eyebrow">
<i class="fa-solid fa-heart"></i>
<span data-i18n="favorites_collection">
                        TU COLECCIÓN
                    </span>
</span>
<h1 data-i18n="favorites_title">
                    Mis favoritos
                </h1>
<p data-i18n="favorites_description">
                    Todos los productos que guardaste para
                    tus mascotas están aquí.
                </p>
</div>
<div class="hero-decoration">
<i class="fa-solid fa-heart"></i>
</div>
</div>
</div>
</section>
<!-- =====================================================
     CONTENIDO
===================================================== -->
<main class="favorites-main">
<div class="container">
<!-- CABECERA -->
<div class="content-header">
<div>
<span data-i18n="favorites_brand">
                    PETCARE
                </span>
<h2 data-i18n="saved_products">
                    Productos guardados
                </h2>
</div>
<div class="favorite-total">
<i class="fa-solid fa-heart"></i>
<strong id="favoriteCount">
                    0
                </strong>
<span data-i18n="products">
                    productos
                </span>
</div>
</div>
<!-- PRODUCTOS -->
<div class="favorites-list" id="favoritesList">
</div>
<!-- ESTADO VACÍO -->
<div class="empty-state" id="emptyState">
<div class="empty-heart">
<i class="fa-regular fa-heart"></i>
</div>
<span data-i18n="no_favorites">
                SIN FAVORITOS
            </span>
<h2 data-i18n="no_saved_products">
                Todavía no has guardado productos
            </h2>
<p data-i18n="no_favorites_description">
                Cuando encuentres algo que te guste,
                presiona el corazón para agregarlo
                a tu colección.
            </p>
<button class="primary-btn" data-i18n="explore_products">
<i class="fa-solid fa-paw"></i>

                Explorar productos

            </button>
</div>
</div>
</main>
<!-- =====================================================
     FOOTER
===================================================== -->
<script src="JS/favoritos.js"></script>
<div data-petcare-footer=""></div><script src="JS/shared.js"></script></body>
</html>
